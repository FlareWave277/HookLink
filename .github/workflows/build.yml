name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build App & Package IPA
        run: |
          mkdir -p build
          xcodebuild archive \
            -scheme HookLink \
            -sdk iphoneos \
            -archivePath build/HookLink.xcarchive \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p build/Payload
          cp -R build/HookLink.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r HookLink.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HookLink-IPA
          path: build/HookLink.ipa
